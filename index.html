<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Soundscapes</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Soundscapes">
<meta name="description" content="Focus timer with layered ambient soundscapes. Powered by Coastline Films.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#23506E; --accent:#A9DDEB;
    --ink:rgba(255,255,255,.97); --mute:rgba(255,255,255,.72); --faint:rgba(255,255,255,.22); --wash:rgba(20,20,22,.34); --glass:blur(22px) saturate(140%);
    --r-lg:28px; --r-md:18px;
    --pad:clamp(20px,6vw,28px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:#000}
  body{
    font-family:Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);
    background:#000;
    min-height:100dvh;-webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }
  .stage{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden}
  .stage .ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;opacity:0;transform:scale(1.03);transition:opacity 1s ease,transform 6s ease-out}
  .stage .ph.show{opacity:1;transform:none}
  .stage::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
  @media (max-width:600px){   /* phones: a touch darker and softly blurred for legibility */
    .stage::after{background:rgba(0,0,0,.32)}
    .stage .ph{filter:blur(6px);transform:scale(1.1)}
    .stage .ph.show{transform:scale(1.07)}
  }
  .app{position:relative;z-index:1}
  .top h1,.digits,.status,.label,.scene span{text-shadow:0 1px 18px rgba(0,0,0,.28)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px}
  svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .app{
    max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) var(--pad) calc(env(safe-area-inset-bottom) + 18px);
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
  .top h1{font-size:30px;font-weight:600;line-height:1.1;text-wrap:balance}
  .status{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px;color:var(--mute);font-weight:500}
  .bars{display:none;gap:2px;align-items:flex-end;height:11px}
  .on .bars{display:inline-flex}
  .bars i{width:2.5px;height:3px;border-radius:2px;background:var(--accent);transform-origin:bottom}
  .on .bars i{animation:bar 1.1s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}
  @keyframes bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(3.6)}}
  .play{
    width:60px;height:60px;border-radius:50%;background:var(--ink);color:#111;
    display:grid;place-items:center;flex:none;transition:transform .15s ease-out,color .6s ease;
  }
  .play:active{transform:scale(.94)}
  .play svg{width:22px;height:22px;fill:currentColor;stroke:none}
  .play .pl{margin-left:3px}

  /* ---------- timer ---------- */
  .timer{padding:clamp(28px,7vh,64px) 0 clamp(24px,5vh,44px);text-align:center}
  .digits{
    font-weight:200;font-size:clamp(92px,29vw,138px);line-height:.9;
    font-variant-numeric:tabular-nums;
  }
  .track-time{height:3px;border-radius:3px;background:var(--faint);margin:26px auto 0;max-width:240px;overflow:hidden}
  .track-time span{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .3s linear}
  .modes{display:flex;justify-content:center;gap:4px;margin:26px auto 0;padding:4px;border-radius:999px;background:var(--wash);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);width:max-content;max-width:100%}
  .modes button{padding:9px 12px;white-space:nowrap;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute);transition:color .15s ease-out}
  .modes button[aria-checked="true"]{background:var(--ink);color:#111}
  .actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px}
  .start{
    min-width:168px;height:54px;border-radius:999px;border:1.5px solid var(--ink);background:rgba(255,255,255,.06);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    font-size:16px;font-weight:600;transition:transform .15s ease-out;
  }
  .start:active{transform:scale(.97)}
  .reset{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
  .reset[hidden]{display:none}

  /* ---------- mixer ---------- */
  .mixer{background:var(--wash);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-radius:var(--r-lg);padding:8px 6px 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .row{display:grid;grid-template-columns:48px 1fr;align-items:center;column-gap:8px;padding:10px 12px 10px 6px;transition:opacity .2s ease-out}
  .row.off{opacity:.42}
  .toggle{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;grid-row:span 2}
  .toggle:active{background:var(--wash)}
  .label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:500;padding-right:2px}
  .label span:last-child{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
  .slider{position:relative;height:30px;touch-action:pan-y;cursor:pointer;display:flex;align-items:center}
  .slider .rail{position:absolute;left:0;right:0;height:6px;border-radius:6px;background:var(--faint)}
  .slider .fill{position:absolute;left:0;height:6px;border-radius:6px;background:var(--accent);width:calc(11px + (100% - 22px) * var(--p,0))}
  .slider .knob{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);left:calc((100% - 22px) * var(--p,0));transition:transform .15s ease-out}
  .slider.drag .knob{transform:scale(1.15)}
  .mix-foot{display:flex;justify-content:flex-end;padding:2px 10px 6px}
  .mix-foot button{font-size:13px;font-weight:500;color:var(--mute);padding:8px 8px}

  /* ---------- scenes ---------- */
  .scenes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 22px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none;scroll-padding-inline:var(--pad)}
  .scenes::-webkit-scrollbar{display:none}
  .scene{scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:68px}
  .swatch{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .15s ease-out;position:relative;overflow:hidden}
  .swatch::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
  .swatch svg{position:relative}
  .scene:active .swatch{transform:scale(.94)}
  .scene[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px rgba(0,0,0,.5),0 0 0 4px var(--ink)}
  .scene span{font-size:12px;font-weight:500;color:var(--mute);white-space:nowrap}
  .scene[aria-pressed="true"] span{color:var(--ink)}

  /* ---------- done sheet ---------- */
  .sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s ease-out;z-index:10}
  .sheet.show{opacity:1;pointer-events:auto}
  .sheet > div{
    width:min(460px,100%);background:rgba(22,22,24,.72);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-radius:var(--r-lg) var(--r-lg) 0 0;
    padding:28px var(--pad) calc(env(safe-area-inset-bottom) + 24px);transform:translateY(24px);transition:transform .2s ease-out;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet.show > div{transform:none}
  .sheet h2{font-size:24px;font-weight:600}
  .sheet p{color:var(--mute);margin-top:6px;font-size:15px;text-wrap:pretty}
  .sheet .btns{display:flex;gap:10px;margin-top:22px}
  .sheet .btns button{flex:1;height:52px;border-radius:999px;font-weight:600}
  .primary{background:var(--ink);color:#111}
  .secondary{border:1.5px solid var(--faint)}

  .credit{text-align:center;font-size:11px;font-weight:500;color:var(--mute);opacity:.7;padding:22px 0 4px}
  .credit a{color:inherit;text-decoration:none}
  .credit a:hover{color:var(--ink)}
  @media (min-width:900px){
    .app{max-width:980px;display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto 1fr auto;column-gap:64px;align-content:center}
    .top{grid-column:1/3}
    .timer{grid-column:1;grid-row:2;align-self:center}
    .mixer{grid-column:2;grid-row:2;align-self:center}
    .scenes{grid-column:1/3;grid-row:3;justify-content:center;margin:0;padding:40px 0 0}
    .credit{grid-column:1/3;grid-row:4}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" aria-hidden="true"></div>
<div class="app">
  <header class="top" id="top">
    <div>
      <h1 id="sceneName">Ocean</h1>
      <div class="status"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="status">5 sounds</span></div>
    </div>
    <button class="play" id="play" aria-label="Play sound"></button>
  </header>

  <section class="timer" aria-label="Timer">
    <div class="digits" id="clock" role="timer" aria-live="off">25:00</div>
    <div class="track-time" aria-hidden="true"><span id="progress"></span></div>
    <div class="modes" role="radiogroup" aria-label="Session length" id="modes">
      <button role="radio" data-min="25" data-kind="Focus">Focus</button>
      <button role="radio" data-min="50" data-kind="Deep work">Deep work</button>
      <button role="radio" data-min="5" data-kind="Break">Break</button>
      <button role="radio" data-min="15" data-kind="Long break">Long break</button>
    </div>
    <div class="actions">
      <button class="start" id="start">Start focus</button>
      <button class="reset" id="reset" aria-label="Reset timer" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </section>

  <nav class="scenes" id="scenes" aria-label="Soundscapes"></nav>
  <section class="mixer" aria-label="Mix">
    <div id="rows"></div>
    <div class="mix-foot"><button id="resetMix">Reset mix</button></div>
  </section>

  <footer class="credit">Powered by <a href="https://coastlinefilms.ca" target="_blank" rel="noopener">Coastline Films</a></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div>
    <h2 id="sheetTitle">Focus done</h2>
    <p id="sheetText">Good work. Step away for five minutes.</p>
    <div class="btns">
      <button class="secondary" id="sheetClose">Close</button>
      <button class="primary" id="sheetNext">Start break</button>
    </div>
  </div>
</div>

<script>
const AUDIO={boat:'sounds/boat.m4a',waves:'sounds/waves.m4a',birds:'sounds/birds.m4a',lapping:'sounds/lapping.m4a',bubbles:'sounds/bubbles.m4a',rain:'sounds/rain.m4a',pouring:'sounds/pouring.m4a',surface:'sounds/surface.m4a',thunder:'sounds/thunder.m4a',stormwind:'sounds/stormwind.m4a',fire:'sounds/fire.m4a',crickets:'sounds/crickets.m4a',bugs:'sounds/bugs.m4a',stream:'sounds/stream.m4a',chimes:'sounds/chimes.m4a',tropical:'sounds/tropical.m4a',train:'sounds/train.m4a',coffee:'sounds/coffee.m4a',street:'sounds/street.m4a',chatter:'sounds/chatter.m4a',sails:'sounds/sails.m4a'};
</script>

const PLAY = '<svg viewBox="0 0 24 24" class="pl"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

/* ============ scenes ============ */
const f = (id,name,ic,def) => ({id,name,icon:ic,def,src:id});
const SCENES = {

/* ============ audio engine ============ */
let ctx, master, noiseBufs = {}, keepAlive;
const decoded = {};
function ensureAudio(){
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
  // iPhone: a silent media element moves audio onto the playback channel, so the ring/silent switch doesn't mute it
  try{
    const sr=8000,n=sr,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    keepAlive=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))); keepAlive.loop=true; keepAlive.setAttribute('playsinline','');
  }catch(e){}
}
/* Blend the last 2s of a recording into its first 2s (equal-power), so the buffer can loop on its own with no seam */
const loops = new WeakMap();
function seamless(buf){
  if (loops.has(buf)) return loops.get(buf);
  const sr=buf.sampleRate, X=Math.min(Math.floor(sr*2), Math.floor(buf.length/4)), N=buf.length, L=N-X;
  const out=ctx.createBuffer(buf.numberOfChannels, L, sr);
  for (let ch=0; ch<buf.numberOfChannels; ch++){
    const src=buf.getChannelData(ch), dst=out.getChannelData(ch);
    for (let i=0;i<X;i++){ const t=i/X; dst[i]=src[L+i]*Math.cos(t*Math.PI/2)+src[i]*Math.sin(t*Math.PI/2); }
    dst.set(src.subarray(X,L), X);
  }
  loops.set(buf,out); return out;
}
function getBuffer(key){
  if (!decoded[key]) decoded[key] = fetch(AUDIO[key]).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>ctx.decodeAudioData(b,res,rej)));
  return decoded[key];
}
function noiseBuf(type){
  if (noiseBufs[type]) return noiseBufs[type];
  const len=ctx.sampleRate*6, b=ctx.createBuffer(2,len,ctx.sampleRate);
  for (let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for (let i=0;i<len;i++){ const x=Math.random()*2-1;
      if (type==='white') d[i]=x;
      else if (type==='pink'){ b0=.99886*b0+x*.0555179;b1=.99332*b1+x*.0750759;b2=.969*b2+x*.153852;b3=.8665*b3+x*.3104856;b4=.55*b4+x*.5329522;b5=-.7616*b5-x*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+x*.5362)*.11;b6=x*.115926; }
      else { last=(last+.02*x)/1.02; d[i]=last*3.5; } }
    for (let i=0;i<2048;i++){ const a=i/2048; d[i]=d[i]*a+d[len-2048+i]*(1-a); } }

}
/* a layer source: recorded loop with crossfaded passes, or synthesized noise */
function runLayer(layer, out){
  const r = {alive:true, src:[], tm:[]};
  r.stop = () => { r.alive=false; r.tm.forEach(clearTimeout); r.src.forEach(s=>{ try{ s.stop(ctx.currentTime+1) }catch(e){} }); };
  if (layer.gen==='loons'){ loonLayer(out, r); return r; }
  if (layer.gen && GEN[layer.gen]){ GEN[layer.gen](out, r); return r; }
  if (layer.synth){
    const [type,cut,lvl]=layer.synth, s=ctx.createBufferSource(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noiseBuf(type); s.loop=true; lp.type='lowpass'; lp.frequency.value=cut; g.gain.value=lvl;
    s.connect(lp).connect(g).connect(out); s.start(); r.src.push(s); return r;
  }
  getBuffer(layer.src).then(buf=>{
    if (!r.alive) return;
    const s=ctx.createBufferSource(), g=ctx.createGain();
    s.buffer=seamless(buf); s.loop=true;               // loops forever, sample-accurate, no timers
    s.connect(g).connect(out);
    g.gain.setValueAtTime(0,ctx.currentTime); g.gain.linearRampToValueAtTime(1,ctx.currentTime+.6);
    s.start(); r.src.push(s);
  }).catch(e=>console.error('Could not load',layer.src,e));
  return r;
}

/* ============ distant loons: real calls, spaced out, far across a lake ============ */
const LOON_CLIPS = [['wail',.34],['wail-a',.2],['wail-b',.14],['yodel-a',.16],['yodel-b',.16]];
const loonBuf = {};
const getLoon = n => loonBuf[n] || (loonBuf[n] = fetch(`sounds/loon-${n}.m4a`).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>ctx.decodeAudioData(b,res,rej))));
let lakeIR=null;
function makeLakeIR(){   /* big open-water space: 120ms pre-delay, ~5s dark tail, a far-shore echo */
  const sr=ctx.sampleRate, pre=Math.floor(sr*.06), len=Math.floor(sr*3), b=ctx.createBuffer(2,len,sr);
  for (let ch=0; ch<2; ch++){ const d=b.getChannelData(ch); let lp=0;
    for (let i=pre;i<len;i++){ const t=(i-pre)/sr; lp+=((Math.random()*2-1)-lp)*.09; d[i]=lp*Math.exp(-t*1.9)*Math.min(1,t/.1); }
    const echo=Math.floor((.62+ch*.035)*sr); for (let j=0;j<sr*.9;j++) d[echo+j]+=(Math.random()*2-1)*.05*Math.exp(-j/(sr*.2)); }
  return b;
}
function pickLoon(){ let x=Math.random(), acc=0; for (const [n,w] of LOON_CLIPS){ acc+=w; if (x<=acc) return n; } return 'wail'; }
function loonLayer(out, r){
  if (!lakeIR) lakeIR=makeLakeIR();
  LOON_CLIPS.forEach(([n])=>getLoon(n));
  const voice=(pan,cut,level)=>{
    const hp=ctx.createBiquadFilter(), lp=ctx.createBiquadFilter(), dry=ctx.createGain(), wet=ctx.createGain(), cv=ctx.createConvolver(), g=ctx.createGain(), p=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();
    hp.type='highpass'; hp.frequency.value=260; lp.type='lowpass'; lp.frequency.value=cut;
    dry.gain.value=1; wet.gain.value=.22; cv.buffer=lakeIR; g.gain.value=level; if (p.pan) p.pan.value=pan;
    hp.connect(lp); lp.connect(dry).connect(g); lp.connect(cv).connect(wet).connect(g); g.connect(p).connect(out);
    return hp;
  };
  const play=(name,t,pan,cut,level)=>getLoon(name).then(buf=>{
    if (!r.alive) return;
    const s=ctx.createBufferSource(); s.buffer=buf; s.playbackRate.value=.96+Math.random()*.06;
    s.connect(voice(pan,cut,level)); s.start(t);
  }).catch(()=>{});
  const call=()=>{
    if (!r.alive) return;
    const side=Math.random()<.5?-1:1, t=ctx.currentTime+.1;
    play(pickLoon(), t, side*(.25+Math.random()*.4), 1900, .068);
    if (Math.random()<.3) play(Math.random()<.6?'wail-b':'wail-a', t+6+Math.random()*5, -side*(.5+Math.random()*.3), 1200, .042);  /* a farther loon answers */
    r.tm.push(setTimeout(call, (15+Math.random()*25)*1000));   /* quiet for 15 to 40 seconds */
  };
  r.tm.push(setTimeout(call, (4+Math.random()*4)*1000));
}

/* ============ generated textures for the Noise scene ============ */
function N(type,dst){ const s=ctx.createBufferSource(); s.buffer=noiseBuf(type); s.loop=true; s.loopStart=0; s.connect(dst); s.start(ctx.currentTime, Math.random()*5); return s; }
function F(type,f,q=.7,gainDb=0){ const n=ctx.createBiquadFilter(); n.type=type; n.frequency.value=f; n.Q.value=q; n.gain.value=gainDb; return n; }
function G(v){ const g=ctx.createGain(); g.gain.value=v; return g; }

function osc(f, dst, r, type='sine'){ const o=ctx.createOscillator(); o.type=type; o.frequency.value=f; o.connect(dst); o.start(); r.src.push(o); return o; }
const GEN = {
  grey(out,r){ const a=F('peaking',1000,.6,-11), b=F('lowshelf',160,.7,5), c=F('highshelf',7000,.7,3), lp=F('lowpass',12000), g=G(LV.grey);
    a.connect(b).connect(c).connect(lp).connect(g).connect(out); r.src.push(N('pink',a)); },
  fan(out,r){ const body=F('lowpass',850,.5), g=G(LV.fan), am=G(1); body.connect(am).connect(g).connect(out);
    lfo(am.gain, 13.5, .06, r); r.src.push(N('pink',body));
    const hum=F('lowpass',180), hg=G(.55); hum.connect(hg).connect(g); r.src.push(N('brown',hum)); },
  cabin(out,r){ const lo=F('lowpass',420,.6), g=G(LV.cabin); lo.connect(g).connect(out); r.src.push(N('brown',lo));
    const mid=F('bandpass',360,.6), mg=G(.35); mid.connect(mg).connect(g); r.src.push(N('pink',mid));
    const eng=G(.025); eng.connect(g); osc(116,eng,r); osc(116.6,eng,r); },
  swell(out,r){ const lp=F('lowpass',1100,.5), am=G(.55), g=G(LV.swell); lp.connect(am).connect(g).connect(out);
    lfo(am.gain, .09, .4, r); lfo(lp.frequency, .09, 500, r); r.src.push(N('pink',lp)); },
  hush(out,r){ const g=G(LV.hush); [[-.5,.061,0],[.5,.047,1.7]].forEach(([p,rate,ph])=>{
      const bp=F('bandpass',650,1.4), pn=ctx.createStereoPanner?ctx.createStereoPanner():G(1), lv=G(.6); if (pn.pan) pn.pan.value=p;
      bp.connect(lv).connect(pn).connect(g); lfo(bp.frequency, rate, 420, r); lfo(lv.gain, rate*1.3, .3, r); r.src.push(N('white',bp)); });
    g.connect(out); },
  under(out,r){ const lp=F('lowpass',260,1.6), g=G(LV.under); lp.connect(g).connect(out); lfo(lp.frequency,.17,90,r); r.src.push(N('brown',lp)); },
  hiss(out,r){ const hp=F('highpass',2600,.5), lp=F('lowpass',9500,.5), g=G(LV.hiss); hp.connect(lp).connect(g).connect(out); r.src.push(N('pink',hp)); },
  space(out,r){ const lp=F('lowpass',95,.9), g=G(LV.space); lp.connect(g).connect(out); lfo(lp.frequency,.03,30,r); r.src.push(N('brown',lp));
    const sub=G(.09); sub.connect(g); osc(38,sub,r); const s2=G(.04); s2.connect(g); osc(57.2,s2,r); },
  alpha(out,r){ const m=ctx.createChannelMerger(2), g=G(LV.alpha); m.connect(g).connect(out);
    const L=G(1), R=G(1); L.connect(m,0,0); R.connect(m,0,1); osc(200,L,r); osc(210,R,r); },   /* 10 Hz difference between ears */
  drone(out,r){ const lp=F('lowpass',900,.4), g=G(LV.drone); lp.connect(g).connect(out); lfo(lp.frequency,.04,350,r);
    [55,82.41,110,164.81].forEach((f,i)=>{ const v=G([1,.7,.55,.3][i]); v.connect(lp); osc(f-.18,v,r,'triangle'); osc(f+.18,v,r,'triangle'); }); }
};
let LV = {alpha:0.099,cabin:0.727,drone:0.141,fan:0.873,grey:0.617,hiss:0.484,hush:0.971,space:1.014,swell:1.459,under:0.789};   /* loudness-matched to Brown (tones and hiss sit ~4-5 LU lower) */

/* ============ interface sounds ============ */
function uiTone(f,{to=null,glide=.05,a=.004,d=.3,v=.15,t=0}={}){
  ensureAudio();
  const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter(), s=ctx.currentTime+.01+t;
  lp.type='lowpass'; lp.frequency.value=6000;
  o.frequency.setValueAtTime(f,s); if (to) o.frequency.exponentialRampToValueAtTime(to,s+glide);
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(v,s+a); g.gain.exponentialRampToValueAtTime(.0001,s+a+d);
  o.connect(g).connect(lp).connect(ctx.destination); o.start(s); o.stop(s+a+d+.05);

const uiPop   = () => uiTone(520,{to:900,glide:.03,d:.08,v:.22});            /* any button */
const glassOn = () => { uiTone(1760,{d:.35,v:.11}); uiTone(1760*2.76,{d:.12,v:.028}); };  /* timer starts */
const glassOff= () => { uiTone(1318,{d:.35,v:.11}); uiTone(1318*2.76,{d:.12,v:.028}); };  /* timer stops */
const TIMER_BUTTONS = new Set(['start','reset','sheetNext']);
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (b && !TIMER_BUTTONS.has(b.id)) uiPop();
}, true);
document.addEventListener('keydown', e => {
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('button') && !TIMER_BUTTONS.has(e.target.id)) uiPop();

/* ============ state ============ */
const store=(k,v)=>{ try{ localStorage.setItem('ss1_'+k,JSON.stringify(v)) }catch(e){} };
const load=k=>{ try{ return JSON.parse(localStorage.getItem('ss1_'+k)) }catch(e){ return null } };
let sceneKey = SCENES[load('scene')] ? load('scene') : 'ocean';
const mixes = load('mixes') || {};
function mixFor(k){
  const m = mixes[k] || (mixes[k] = {});
  SCENES[k].layers.forEach(l=>{ if (!m[l.id]) m[l.id]={v:l.def,on:!l.off}; }); Object.keys(m).forEach(id=>{ if (!SCENES[k].layers.some(l=>l.id===id)) delete m[id]; });
  return m;
}
let playing=false, active=null;
const level = (k,id) => { const s=mixFor(k)[id]; return s.on ? s.v : 0; };

function startSound(){
  ensureAudio();
  try{ keepAlive && keepAlive.play().catch(()=>{}); }catch(e){}
  stopSound(true);
  const bus=ctx.createGain(); bus.gain.value=0; bus.connect(master);
  const layers={};
  SCENES[sceneKey].layers.forEach(l=>{ const g=ctx.createGain(); g.gain.value=level(sceneKey,l.id); g.connect(bus); layers[l.id]={g,run:runLayer(l,g)}; });
  bus.gain.setTargetAtTime(1,ctx.currentTime,.5);
  active={key:sceneKey,bus,layers}; playing=true; paintStatus();
}
function stopSound(swap){
  if (active){
    const {bus,layers}=active;
    bus.gain.cancelScheduledValues(ctx.currentTime); bus.gain.setTargetAtTime(0,ctx.currentTime,.3);
    Object.values(layers).forEach(l=>l.run.stop()); setTimeout(()=>bus.disconnect(),2000); active=null;
  }
  if (!swap){ playing=false; try{ keepAlive && keepAlive.pause(); }catch(e){} paintStatus(); }
}
const toggleSound = () => playing ? stopSound() : startSound();
function setLevel(id){
  if (active && active.key===sceneKey) active.layers[id].g.gain.setTargetAtTime(level(sceneKey,id),ctx.currentTime,.05);
  store('mixes',mixes);
}

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const imgURL = (id,w) => `https://images.unsplash.com/${id}?w=${w}&q=82&auto=format&fit=max`;
const photoLayers = {};
function stagePhoto(k){
  const S=SCENES[k];
  if (!photoLayers[k]){
    const d=document.createElement('div'); d.className='ph';
    d.style.backgroundPosition=S.focus;
    const w = Math.max(screen.width,screen.height)*(window.devicePixelRatio||1) > 3840 ? 5120 : 3840;
    const img=new Image(); img.onload=()=>{ d.style.backgroundImage=`url("${img.src}")`; if (k===sceneKey) requestAnimationFrame(()=>d.classList.add('show')); };
    img.src=imgURL(S.photo,w);
    $('stage').appendChild(d); photoLayers[k]=d;
  }
  Object.entries(photoLayers).forEach(([key,el])=>{ if (key===k){ if (el.style.backgroundImage) el.classList.add('show'); } else el.classList.remove('show'); });
}
function preloadPhotos(){ Object.keys(SCENES).forEach(k=>{ if (k!==sceneKey){ const w=Math.max(screen.width,screen.height)*(window.devicePixelRatio||1)>3840?5120:3840; const i=new Image(); i.src=imgURL(SCENES[k].photo,w); } }); }
function paintTheme(){

function paintStatus(){
  const n=SCENES[sceneKey].layers.filter(l=>mixFor(sceneKey)[l.id].on).length;
  $('top').classList.toggle('on',playing);
  $('status').textContent = playing ? 'Playing' : `${n} ${n===1?'sound':'sounds'}`;
  $('play').innerHTML = playing ? PAUSE : PLAY;
  $('play').setAttribute('aria-label', playing ? 'Pause sound' : 'Play sound');
}
function paintRows(){
  const S=SCENES[sceneKey], mix=mixFor(sceneKey), wrap=$('rows'); wrap.innerHTML='';
  S.layers.forEach(l=>{
    const st=mix[l.id], row=document.createElement('div');
    row.className='row'+(st.on?'':' off');
    row.innerHTML=`<button class="toggle" aria-pressed="${st.on}" aria-label="${l.name}">${icon(l.icon)}</button>
      <div class="label"><span>${l.name}</span><span class="pct"></span></div>
      <div class="slider" role="slider" tabindex="0" aria-label="${l.name} volume" aria-valuemin="0" aria-valuemax="100">
        <div class="rail"></div><div class="fill"></div><div class="knob"></div></div>`;
    const sl=row.querySelector('.slider'), fill=row.querySelector('.fill'), knob=row.querySelector('.knob'), pct=row.querySelector('.pct'), tg=row.querySelector('.toggle');
    const draw=()=>{ const p=st.v*100; sl.style.setProperty('--p',st.v); pct.textContent=st.on?Math.round(p)+'%':'Off'; sl.setAttribute('aria-valuenow',Math.round(p)); row.classList.toggle('off',!st.on); tg.setAttribute('aria-pressed',st.on); };
    draw();
    tg.onclick=()=>{ st.on=!st.on; draw(); setLevel(l.id); paintStatus(); if (st.on && !playing) startSound(); };
    const at=e=>{ const r=sl.getBoundingClientRect(); st.v=Math.round(Math.min(1,Math.max(0,(e.clientX-r.left-11)/(r.width-22)))*20)/20; st.on=true; draw(); setLevel(l.id); };
    let startX=0, dragging=false;
    sl.addEventListener('pointerdown',e=>{ startX=e.clientX; dragging=true; sl.setPointerCapture(e.pointerId); sl.classList.add('drag'); at(e); if (!playing) startSound(); });
    sl.addEventListener('pointermove',e=>{ if (dragging) at(e); });
    const end=()=>{ dragging=false; sl.classList.remove('drag'); paintStatus(); };
    sl.addEventListener('pointerup',end); sl.addEventListener('pointercancel',end);
    sl.addEventListener('keydown',e=>{ const d={ArrowRight:.05,ArrowUp:.05,ArrowLeft:-.05,ArrowDown:-.05}[e.key]; if (d===undefined) return; e.preventDefault(); st.v=Math.round(Math.min(1,Math.max(0,st.v+d))*20)/20; st.on=true; draw(); setLevel(l.id); });
    wrap.appendChild(row);
  });
}
function paintScenes(){
  const nav=$('scenes'); nav.innerHTML='';
  Object.entries(SCENES).forEach(([k,S])=>{
    const b=document.createElement('button'); b.className='scene'; b.setAttribute('aria-pressed',k===sceneKey);
    b.innerHTML=`<span class="swatch" style="background-color:${S.bg};background-image:url('${imgURL(S.photo,240)}')">${icon(S.icon)}</span><span>${S.name}</span>`;
    b.onclick=()=>{ sceneKey=k; store('scene',k); paintAll(); startSound(); };
    nav.appendChild(b);
  });
}
function paintAll(){ paintTheme(); paintRows(); paintScenes(); paintStatus(); }

$('play').onclick=toggleSound;
$('resetMix').onclick=()=>{ delete mixes[sceneKey]; mixFor(sceneKey); SCENES[sceneKey].layers.forEach(l=>setLevel(l.id)); paintRows(); paintStatus(); };
document.addEventListener('keydown',e=>{
  if (e.code==='Space' && !e.target.closest('button,.slider')){ e.preventDefault(); toggleSound(); }
});

/* ============ timer ============ */
let mode = load('mode') || {min:25,kind:'Focus'}, total=mode.min*60, left=total, tick=null, endAt=0;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paintTimer(){
  $('clock').textContent=fmt(left);
  $('progress').style.transform=`scaleX(${1-left/total})`;
  $('start').textContent = tick ? 'Pause' : (left<total ? 'Resume' : `Start ${mode.kind.toLowerCase()}`);
  $('reset').hidden = !(tick || left<total);
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-checked', +b.dataset.min===mode.min));
  document.title = tick ? `${fmt(left)} ${mode.kind}` : 'Soundscapes';
}
function chime(){
  ensureAudio();
  [523.25,659.25,783.99].forEach((fq,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+i*.2;
    o.frequency.value=fq; o.connect(g).connect(ctx.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+2.4); o.start(t); o.stop(t+2.5); });
}
function setMode(min,kind){ clearInterval(tick); tick=null; mode={min,kind}; store('mode',mode); total=min*60; left=total; paintTimer(); }
function startPause(){
  if (tick){ clearInterval(tick); tick=null; left=Math.max(0,Math.round((endAt-Date.now())/1000)); glassOff(); paintTimer(); return; }
  endAt=Date.now()+left*1000; glassOn(); if (!playing) startSound();
  tick=setInterval(()=>{
    left=Math.max(0,Math.round((endAt-Date.now())/1000)); paintTimer();
    if (left<=0){ clearInterval(tick); tick=null; glassOff(); finished(); }
  },250);
  paintTimer();
}
function finished(){
  const focus=/Focus|Deep/.test(mode.kind);
  $('sheetTitle').textContent = focus ? `${mode.kind} done` : 'Break over';
  $('sheetText').textContent = focus ? 'Good work. Step away for five minutes.' : 'Ready when you are.';
  $('sheetNext').textContent = focus ? 'Start break' : 'Start focus';
  $('sheetNext').onclick = () => { closeSheet(); focus ? setMode(5,'Break') : setMode(25,'Focus'); startPause(); };
  $('sheet').classList.add('show'); $('sheetNext').focus();
  left=total; paintTimer();
}
const closeSheet=()=>$('sheet').classList.remove('show');
$('sheetClose').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{ if (e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeSheet(); });
$('start').onclick=startPause;
$('reset').onclick=()=>{ if (tick || left<total) glassOff(); setMode(mode.min,mode.kind); };
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.min,b.dataset.kind));
document.addEventListener('visibilitychange',()=>{ if (!document.hidden && tick){ left=Math.max(0,Math.round((endAt-Date.now())/1000)); paintTimer(); } });

paintAll(); paintTimer();
setTimeout(preloadPhotos, 2500);
</script>
</body>
</html>
